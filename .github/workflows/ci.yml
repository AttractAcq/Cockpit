name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Edge Function registry
        run: npm run check:edge-functions

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Diagnostic only for now, not a required gate: `npm run typecheck`
      # only covers src/, so supabase/functions/ has never had a type-check
      # step before this. `continue-on-error` until a first clean run
      # confirms the existing ~105 functions pass, since this could not be
      # verified locally before adding it (no Deno CLI in that environment).
      - name: Edge Function types (diagnostic)
        run: npm run check:edge-functions-types
        continue-on-error: true

      - name: Test
        run: node --test tests/*.test.ts

      - name: Build
        run: npm run build

      - name: Whitespace / conflict-marker check
        run: git diff --check
