name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Edge Function registry
        run: npm run check:edge-functions

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # `npm run typecheck` only covers src/, so this is the only type-check
      # supabase/functions/ gets. Started as continue-on-error (this repo
      # had no Deno CLI to verify locally before adding it) -- promoted to a
      # real gate once this same PR's own first CI run confirmed all ~105
      # functions pass cleanly (run 32467820406, step "Edge Function types
      # (diagnostic)", conclusion: success).
      - name: Edge Function types
        run: npm run check:edge-functions-types

      - name: Test
        run: node --test tests/*.test.ts

      - name: Build
        run: npm run build

      - name: Whitespace / conflict-marker check
        run: git diff --check
