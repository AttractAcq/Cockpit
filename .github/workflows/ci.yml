name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Edge Function registry
        run: npm run check:edge-functions

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # `npm run typecheck` only covers src/, so this is the only type-check
      # supabase/functions/ gets. Diagnostic only, not a required gate: once
      # a real npm-resolution bug in the command itself was fixed (it needs
      # to run from supabase/functions/ for deno.json's nodeModulesDir:auto
      # to apply), deno check could finally actually run for the first time
      # ever against this codebase -- and surfaced 74 pre-existing type
      # errors (run 32468781407), never caught before because nothing
      # type-checked this code until now. Fixing 74 errors of unknown scope
      # (at least one real, systemic pattern: sb.rpc() returns a
      # PostgrestFilterBuilder, not literally a Promise<RpcResult>, which
      # this codebase's own RpcResult-typed handler signatures assume) is
      # real cleanup work, not something to bulk-fix inline here. Leave
      # diagnostic until that's triaged and fixed as its own scoped effort.
      - name: Edge Function types (diagnostic)
        run: npm run check:edge-functions-types
        continue-on-error: true

      - name: Test
        run: node --test tests/*.test.ts

      - name: Build
        run: npm run build

      - name: Whitespace / conflict-marker check
        run: git diff --check
